<head>
<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:400,700" rel="stylesheet">
<link href='style.css' rel='stylesheet' type='text/css'>
<title>Quiz</title>
<link rel="icon" type="x-icon" href="icon.png">
<link rel="shortcut icon" type="x-icon" href="icon.png">
<meta charset="utf-8">
</head>
<body>

<script type="application/javascript" src="axes.js"></script>
<script type="application/javascript" src="questions.js"></script>

<h1>Quiz</h1>
<hr>
<h2 style="text-align:center;" id="question-number">Loading...</h2>
<p class="question" id="question-text"></p>

<div id="answers"></div>

<button class="small_button" onclick="prev_question()" id="back_button">Back</button>
<button class="small_button_off" id="back_button_off">Back</button><br>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------

// Answers are stored high-to-low in the spreadsheet. Presenting them in that
// fixed order lets a respondent learn that the top button is always the
// positive end. Shuffling breaks that; the permutation is generated once at
// start so going Back doesn't reorder a question mid-quiz.
const SHUFFLE_ANSWERS = true;

// ---------------------------------------------------------------------------
// Startup validation
// ---------------------------------------------------------------------------

(function validate() {
  const known = new Set(AXES);
  let problems = 0;
  questions.forEach((q, i) => {
    if (!q.answers || q.answers.length === 0) {
      console.warn(`Q${q.id} (index ${i}) has no answers`);
      problems++;
    }
    (q.answers || []).forEach((a, j) => {
      for (const axis of Object.keys(a.effects || {})) {
        if (!known.has(axis)) {
          console.warn(`Q${q.id} answer ${j}: unknown axis "${axis}"`);
          problems++;
        }
      }
    });
  });
  if (problems) console.warn(`${problems} problem(s) found in questions.js`);
})();

// ---------------------------------------------------------------------------
// Bounds: the real min and max reachable total for each axis.
// ---------------------------------------------------------------------------

const bounds = {};
for (const axis of AXES) bounds[axis] = { min: 0, max: 0 };

for (const q of questions) {
  for (const axis of AXES) {
    const vals = q.answers.map(a => a.effects[axis] || 0);
    bounds[axis].min += Math.min(...vals);
    bounds[axis].max += Math.max(...vals);
  }
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

var qn = 0;                                    // current question index
const picks = new Array(questions.length).fill(null);   // chosen answer index

// Display order for each question's answers.
const order = questions.map(q => {
  const idx = q.answers.map((_, i) => i);
  if (!SHUFFLE_ANSWERS) return idx;
  for (let i = idx.length - 1; i > 0; i--) {   // Fisher-Yates
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
});

init_question();

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function init_question() {
  const q = questions[qn];

  document.getElementById("question-text").innerHTML = q.question;
  document.getElementById("question-number").innerHTML =
    "Question " + (qn + 1) + " of " + questions.length;

  const box = document.getElementById("answers");
  box.innerHTML = "";

  for (const i of order[qn]) {
    const btn = document.createElement("button");
    btn.className = "button" + (picks[qn] === i ? " selected" : "");
    btn.textContent = q.answers[i].text;
    btn.onclick = () => next_question(i);
    box.appendChild(btn);
    box.appendChild(document.createElement("br"));
  }

  const atStart = (qn === 0);
  document.getElementById("back_button").style.display = atStart ? 'none' : 'block';
  document.getElementById("back_button_off").style.display = atStart ? 'block' : 'none';
}

function next_question(answerIndex) {
  picks[qn] = answerIndex;
  qn++;
  if (qn < questions.length) {
    init_question();
  } else {
    qn--;              // stay in range if results() bails
    results();
  }
}

function prev_question() {
  if (qn === 0) return;
  qn--;
  init_question();
}

// ---------------------------------------------------------------------------
// Scoring
// ---------------------------------------------------------------------------

// Map a raw total onto the -10..+10 scale that axes.js bands assume.
// Written generally so an asymmetric axis still lands sensibly.
function normalize(total, min, max) {
  if (max === min) return 0;
  return -10 + 20 * (total - min) / (max - min);
}

function results() {
  const totals = {};
  for (const axis of AXES) totals[axis] = 0;

  picks.forEach((choice, i) => {
    if (choice === null) return;
    const effects = questions[i].answers[choice].effects;
    for (const [axis, value] of Object.entries(effects)) {
      if (axis in totals) totals[axis] += value;
    }
  });

  const params = AXES.map(axis => {
    const score = normalize(totals[axis], bounds[axis].min, bounds[axis].max);
    return axis + "=" + score.toFixed(2);
  });

  location.href = "results.html?" + params.join("&");
}
</script>

</body>
